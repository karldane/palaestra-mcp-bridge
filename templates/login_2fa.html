{{define "login_2fa.html"}}
{{template "head" .}}
<div style="max-width:400px;margin:80px auto;padding:0 1rem;">
  <div class="card">
    <h2 style="text-align:center;">MCP Bridge</h2>
    <p class="text-muted" style="text-align:center;">Enter your verification code</p>
    {{template "alerts" .}}
    <form method="post" action="/web/login/2fa">
      <div class="form-row">
        <label for="code">6-digit code</label>
        <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem;">Verify</button>
    </form>
    {{if .Extra.Bypass}}
    <form method="post" action="/web/login/2fa" style="margin-top:0.5rem;">
      <button type="submit" class="btn btn-secondary" style="width:100%;">Continue (bypass, development only)</button>
    </form>
    {{end}}
    <p class="text-muted" style="text-align:center;margin-top:1rem;">
      <a href="/web/logout" style="color:var(--text-muted);">Cancel</a>
    </p>
  </div>
</div>
{{template "foot" .}}
{{end}}
